services:
  matchkollen:
    image: matchkollen:latest
    pull_policy: build
    build:
      context: https://github.com/greycreations/matchkollen.git#main
      dockerfile: Dockerfile
    container_name: matchkollen
    restart: unless-stopped
    ports:
      - "8060:8787"
    volumes:
      - matchkollen_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/auth').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  matchkollen_data:
